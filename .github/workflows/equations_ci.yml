name: equations_ci

on:
  pull_request:
    paths-ignore:
      - "**.md"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  verify_equation_package:
    name: Equations package action
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Verify code foramt
        run: dart format --set-exit-if-changed lib test

      - name: Verify analyzer errors
        run: dart analyze --fatal-infos --fatal-warnings lib test

      - name: Run unit tests
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage

      - name: Check Code Coverage
        run: dart pub global activate coverde && dart pub global run coverde check 100
